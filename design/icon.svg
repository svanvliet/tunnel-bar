<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3b5bfd"/>
      <stop offset="1" stop-color="#14206b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.72" r="0.42">
      <stop offset="0" stop-color="#7df9c9" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#37c6ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#37c6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <!-- tunnel interior glow -->
    <path d="M300 760 V560 A212 212 0 0 1 724 560 V782 Z" fill="#0a1240"/>
    <path d="M300 760 V560 A212 212 0 0 1 724 560 V782 Z" fill="url(#glow)"/>
    <!-- road converging to the light -->
    <path d="M456 782 L502 560 L522 560 L568 782 Z" fill="#ffffff" opacity="0.18"/>
    <rect x="507" y="600" width="10" height="36" rx="5" fill="#fff" opacity="0.8"/>
    <rect x="505" y="664" width="14" height="48" rx="7" fill="#fff" opacity="0.9"/>
    <!-- arch -->
    <path d="M240 780 V560 A272 272 0 0 1 784 560 V780 H700 V560 A188 188 0 0 0 324 560 V780 Z"
          fill="url(#arch)"/>
    <!-- ground line -->
    <rect x="200" y="780" width="624" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
    <!-- status dot -->
    <circle cx="512" cy="460" r="44" fill="#34d399" stroke="#ffffff" stroke-width="14"/>
  </g>
</svg>
